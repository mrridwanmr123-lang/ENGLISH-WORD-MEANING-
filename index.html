<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Oxford 3000™ Complete Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4338ca;
      --primary-light: #e0e7ff;
      --success: #059669;
      --success-light: #d1fae5;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-viewport {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    /* Top Sticky Bar */
    header {
      background: linear-gradient(135deg, #4338ca, #312e81);
      color: white;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 15px rgba(67, 56, 202, 0.2);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .level-badge {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.2);
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 700;
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.15);
      padding: 5px;
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }

    /* Horizontal Nav Tabs */
    .tabs-slider {
      display: flex;
      background: #ffffff;
      padding: 8px 12px;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid #e2e8f0;
      scrollbar-width: none;
    }
    .tabs-slider::-webkit-scrollbar { display: none; }

    .tab-item {
      flex: 0 0 auto;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .tab-item.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(67, 56, 202, 0.25);
    }

    /* Main Exercise Container */
    .main-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .progress-line {
      height: 6px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--success);
      transition: width 0.3s ease;
    }

    /* Presentation Card */
    .study-card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px 14px;
      text-align: center;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .sound-button {
      background: var(--primary-light);
      border: 1.5px solid #c7d2fe;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      font-size: 20px;
      color: var(--primary);
      cursor: pointer;
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-title {
      font-size: 26px;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 2px;
      word-break: break-word;
    }

    .item-subtitle {
      font-size: 14px;
      font-weight: 600;
      color: #6366f1;
    }

    /* Interactive Options List */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .option-card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.15s ease;
    }

    .option-card:hover { border-color: #cbd5e1; background: #f8fafc; }
    .option-card:active { transform: scale(0.99); }
    .option-card.correct { background: var(--success-light) !important; border-color: var(--success) !important; color: #065f46 !important; }
    .option-card.wrong { background: var(--danger-light) !important; border-color: var(--danger) !important; color: #991b1b !important; }

    /* Learning Card (After Answer) */
    .learning-card {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 14px;
      margin-top: 14px;
      text-align: left;
      display: none;
    }

    .learning-status { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .learning-en { font-size: 15px; font-weight: 700; color: #1e293b; line-height: 1.4; }
    .learning-bn { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
    .learning-rule { font-size: 13px; color: #1e40af; background: #eff6ff; padding: 8px; border-radius: 8px; margin-top: 8px; }

    /* Action Next Button */
    .next-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 14px;
      font-family: inherit;
      display: none;
      box-shadow: 0 4px 12px rgba(67, 56, 202, 0.25);
    }
    .next-btn:hover { background: #3730a3; }

    .views { display: none; width: 100%; }
    .views.active { display: block; }

    .empty-state {
      text-align: center;
      padding: 40px 10px;
      color: var(--muted);
      font-size: 15px;
    }
  </style>
</head>
<body>

<div class="app-viewport">
  <header>
    <div class="header-content">
      <span class="header-title">Oxford 3000™ Academy</span>
      <span class="level-badge" id="moduleBadge">A1 - A2 Level</span>
    </div>
    <div class="stats-container">
      <div class="stat-pill" id="scoreStat">🎯 পয়েন্ট: 0</div>
      <div class="stat-pill" id="streakStat">🔥 সঠিক: 0</div>
      <div class="stat-pill" id="remainingStat">বাকি: 0</div>
    </div>
  </header>

  <nav class="tabs-slider">
    <button class="tab-item active" onclick="setMode('vocab')">📖 শব্দার্থ (MCQ)</button>
    <button class="tab-item" onclick="setMode('grammar')">🇬🇧 গ্রামার মাস্টার</button>
    <button class="tab-item" onclick="setMode('context')">🧩 বাক্যে শূন্যস্থান</button>
    <button class="tab-item" onclick="setMode('spoken')">🗣️ কমন ভুল সংশোধন</button>
    <button class="tab-item" onclick="setMode('mistakes')">❌ দুর্বলতা রিভিশন</button>
  </nav>

  <div class="main-body">
    <div class="progress-line"><div class="progress-fill" id="progressFill"></div></div>

    <!-- ১. ভোকাবুলারি ভিউ -->
    <div id="view-vocab" class="views active">
      <div class="study-card">
        <button class="sound-button" onclick="playCurrentAudio()" title="উচ্চারণ শুনুন">🔊</button>
        <div class="item-title" id="vocabWord">Word</div>
        <div class="item-subtitle" id="vocabPron">উচ্চারণ</div>
      </div>
      <div class="options-grid" id="vocabOptions"></div>
      <div class="learning-card" id="vocabLearning">
        <div class="learning-status" id="vocabStatus"></div>
        <div class="learning-en" id="vocabSentEn"></div>
        <div class="learning-bn" id="vocabSentBn"></div>
      </div>
      <button class="next-btn" id="vocabNext" onclick="nextVocabQuestion()">পরবর্তী শব্দ ➔</button>
    </div>

    <!-- ২. পূর্ণাঙ্গ গ্রামার ভিউ -->
    <div id="view-grammar" class="views">
      <div style="font-size:12px; background:#eff6ff; color:#1e40af; padding:8px 12px; border-radius:10px; margin-bottom:10px; font-weight:700;" id="grammarTopicName">
        📌 টপিক: Articles & Prepositions
      </div>
      <div class="study-card" style="text-align: left;">
        <div class="item-title" id="grammarQuestion" style="font-size:18px;">Question</div>
        <div class="item-subtitle" id="grammarContext" style="color:var(--muted); font-weight:normal; margin-top:4px;">বাংলা অর্থ</div>
      </div>
      <div class="options-grid" id="grammarOptions"></div>
      <div class="learning-card" id="grammarLearning">
        <div class="learning-rule" id="grammarRule"></div>
      </div>
      <button class="next-btn" id="grammarNext" onclick="nextGrammarQuestion()">পরবর্তী নিয়ম ➔</button>
    </div>

    <!-- ৩. বাক্যে শূন্যস্থান ভিউ -->
    <div id="view-context" class="views">
      <div class="study-card" style="text-align: left;">
        <div style="font-size:12px; color:var(--primary); font-weight:bold; margin-bottom:4px;">সঠিক শব্দটি খালি জায়গায় বসান:</div>
        <div class="item-title" id="clozeQuestion" style="font-size:18px;">Sentence</div>
        <div class="item-subtitle" id="clozeBangla" style="color:var(--muted); font-weight:normal; margin-top:4px;">বাংলা অর্থ</div>
      </div>
      <div class="options-grid" id="clozeOptions"></div>
      <button class="next-btn" id="clozeNext" onclick="nextClozeQuestion()">পরবর্তী বাক্য ➔</button>
    </div>

    <!-- ৪. কমন স্পোকেন মিস্টেক্স -->
    <div id="view-spoken" class="views">
      <div style="font-size:12px; background:#fef3c7; color:#92400e; padding:8px 12px; border-radius:10px; margin-bottom:10px; font-weight:700;">
        💡 কমন ভুল: ইংরেজিতে কথা বলতে গিয়ে আমরা যে ভুলগুলো করি
      </div>
      <div class="study-card" style="text-align: left;">
        <div class="item-title" id="spokenSentence" style="font-size:18px;">Sentence</div>
        <div class="item-subtitle" id="spokenContext" style="color:var(--muted); font-weight:normal; margin-top:4px;">বাংলা অনুবাদ</div>
      </div>
      <div class="options-grid" id="spokenOptions"></div>
      <div class="learning-card" id="spokenLearning">
        <div class="learning-rule" id="spokenExplanation"></div>
      </div>
      <button class="next-btn" id="spokenNext" onclick="nextSpokenQuestion()">পরেরটি দেখুন ➔</button>
    </div>

    <!-- ৫. দুর্বলতা রিভিশন খাতা -->
    <div id="view-mistakes" class="views">
      <div id="mistakeContainer"></div>
    </div>
  </div>
</div>

<script>
  // ১. অক্সফোর্ড মূল শব্দভাণ্ডার
  const vocabularyData = [
    { word: "ability", pron: "অ্যাবিলিটি", meaning: "সামর্থ্য বা দক্ষতা", en: "She has the ability to learn quickly.", bn: "তার দ্রুত শেখার সামর্থ্য আছে।" },
    { word: "abroad", pron: "অ্যাব্রড", meaning: "বিদেশ / অন্য দেশে", en: "He went abroad for higher study.", bn: "তিনি উচ্চশিক্ষার জন্য বিদেশ গেছেন।" },
    { word: "accept", pron: "অ্যাকসেপ্ট", meaning: "মেনে নেওয়া বা গ্রহণ করা", en: "Please accept this honest advice.", bn: "দয়া করে এই সৎ পরামর্শটি গ্রহণ করুন।" },
    { word: "achieve", pron: "অ্যাচিভ", meaning: "অর্জন করা / সফল হওয়া", en: "Work hard to achieve your dream.", bn: "তোমার স্বপ্ন অর্জন করতে পরিশ্রম করো।" },
    { word: "active", pron: "অ্যাক্টিভ", meaning: "সক্রিয় / কর্মঠ", en: "He is an active student.", bn: "সে একজন কর্মঠ শিক্ষার্থী।" },
    { word: "admire", pron: "অ্যাডমায়ার", meaning: "প্রশংসা করা বা শ্রদ্ধা করা", en: "I admire your dedication.", bn: "আমি তোমার নিষ্ঠার প্রশংসা করি।" },
    { word: "advice", pron: "অ্যাডভাইস", meaning: "উপদেশ বা পরামর্শ", en: "Follow the doctor's advice.", bn: "ডাক্তারের পরামর্শ মেনে চলো।" },
    { word: "ancient", pron: "এইনশেন্ট", meaning: "প্রাচীন / অনেক পুরোনো", en: "This is an ancient library.", bn: "এটি একটি প্রাচীন লাইব্রেরি।" },
    { word: "avoid", pron: "অ্যাভয়েড", meaning: "এড়িয়ে চলা / বর্জন করা", en: "Avoid bad company.", bn: "খারাপ সঙ্গ এড়িয়ে চলো।" },
    { word: "borrow", pron: "বরো", meaning: "ধার নেওয়া", en: "Can I borrow your notebook?", bn: "আমি কি তোমার খাতাটি ধার নিতে পারি?" },
    { word: "brave", pron: "ব্রেইভ", meaning: "সাহসী", en: "The brave man stood alone.", bn: "সাহসী লোকটি একা দাঁড়িয়েছিল।" },
    { word: "calm", pron: "কাম", meaning: "শান্ত / স্থির", en: "Stay calm in difficult times.", bn: "কঠিন সময়ে নিজেকে শান্ত রাখো।" },
    { word: "danger", pron: "ডেইঞ্জার", meaning: "বিপদ", en: "Smoking is a great danger to health.", bn: "ধূমপান স্বাস্থ্যের জন্য বড় বিপদ।" },
    { word: "delicious", pron: "ডিলিশাস", meaning: "সুস্বাদু খাবার", en: "This dinner is delicious.", bn: "এই রাতের খাবারটি সুস্বাদু।" },
    { word: "destroy", pron: "ডেস্ট্রয়", meaning: "ধ্বংস করা", en: "Lies can destroy trust.", bn: "মিথ্যা বিশ্বাস ধ্বংস করে দেয়।" }
  ];

  // ২. পূর্ণাঙ্গ গ্রামার প্রশ্নমালা (বাস্তব ও গুরুত্বপূর্ণ নিয়ম)
  const grammarData = [
    {
      topic: "Articles (আর্টিকেল)",
      q: "He is ______ honest police officer.",
      context: "বাংলা: তিনি একজন সৎ পুলিশ অফিসার।",
      correct: "an",
      options: ["an", "a", "the", "no article"],
      rule: "💡 নিয়ম: 'Honest' শব্দের শুরুতে ব্যঞ্জনবর্ণ 'H' থাকলেও এর উচ্চারণ 'অ' (Vowel sound)-এর মতো হয়। তাই এর আগে 'an' বসে।"
    },
    {
      topic: "Articles (আর্টিকেল)",
      q: "My brother studies at ______ university.",
      context: "বাংলা: আমার ভাই একটি বিশ্ববিদ্যালয়ে পড়ে।",
      correct: "a",
      options: ["a", "an", "the", "no article"],
      rule: "💡 নিয়ম: Vowel 'U' যদি 'ইউ' (Yu)-এর মতো উচ্চারিত হয়, তবে তার পূর্বে 'an' না বসে 'a' বসে।"
    },
    {
      topic: "Prepositions of Time",
      q: "I have been living in this city ______ 2018.",
      context: "বাংলা: আমি ২০১৮ সাল থেকে এই শহরে বাস করছি।",
      correct: "since",
      options: ["since", "for", "from", "at"],
      rule: "💡 নিয়ম: অতীত থেকে কোনো কাজ শুরু হওয়ার নির্দিষ্ট শুরুর সাল বা সময় (Point of time) বোঝাতে 'since' বসে। মোট সময় বোঝাতে 'for' বসত।"
    },
    {
      topic: "Appropriate Prepositions",
      q: "She is exceptionally good ______ English.",
      context: "বাংলা: সে ইংরেজিতে বিশেষভাবে পারদর্শী।",
      correct: "at",
      options: ["at", "in", "on", "with"],
      rule: "💡 নিয়ম: কোনো বিষয়ে দক্ষতা বোঝাতে 'Good at' হয়, 'Good in' ইংরেজি ব্যাকরণে ভুল।"
    },
    {
      topic: "Subject-Verb Agreement",
      q: "Neither of the two boys ______ present yesterday.",
      context: "বাংলা: ছেলে দুটির কেউই গতকাল উপস্থিত ছিল না।",
      correct: "was",
      options: ["was", "were", "are", "have"],
      rule: "💡 নিয়ম: 'Each', 'Every', 'Neither of', 'Either of'-এর পর সবসময় Singular Verb (was/is) বসে, plural (were) হয় না।"
    },
    {
      topic: "Tenses (Present Perfect)",
      q: "He has already ______ his morning meal.",
      context: "বাংলা: সে ইতিমধ্যে তার সকালের নাস্তা সম্পন্ন করেছে।",
      correct: "finished",
      options: ["finished", "finish", "finishing", "finishes"],
      rule: "💡 নিয়ম: Have/Has-এর পর সবসময় ভার্বের Past Participle বা V3 ফর্ম বসে।"
    }
  ];

  // ৩. কমন স্পোকেন মিস্টেক্স ও কনফিউজিং শব্দ
  const spokenMistakesData = [
    {
      q: "I ______ with your proposal.",
      context: "বাংলা: আমি আপনার প্রস্তাবে একমত।",
      correct: "agree",
      options: ["agree", "am agree"],
      explanation: "💡 ভুল সংশোধন: আমরা প্রায়ই বলি 'I am agree'—এটি ভুল। 'Agree' নিজেই একটি ভার্ব, তাই বলতে হবে 'I agree'."
    },
    {
      q: "We need to ______ the real problem.",
      context: "বাংলা: আমাদের আসল সমস্যাটি নিয়ে আলোচনা করতে হবে।",
      correct: "discuss",
      options: ["discuss", "discuss about"],
      explanation: "💡 ভুল সংশোধন: 'Discuss' শব্দের ভেতরেই 'সম্পর্কে আলোচনা' ভাবটি থাকে। তাই 'discuss about' বলা যাবে না, শুধু 'discuss' হবে।"
    },
    {
      q: "Can you please ______ to what I say?",
      context: "বাংলা: আমি যা বলছি তা মনোযোগ দিয়ে শুনবে কি?",
      correct: "listen",
      options: ["listen", "hear"],
      explanation: "💡 সূক্ষ্ম পার্থক্য: কোনো শব্দ কান দিয়ে মনোযোগের সাথে শোনার জন্য 'listen to' বসে, আর শব্দ আপনাআপনি কানে পৌঁছালে 'hear' বসে।"
    },
    {
      q: "______ bag is placed on the desk?",
      context: "বাংলা: কার ব্যাগটি টেবিলের ওপর রাখা?",
      correct: "Whose",
      options: ["Whose", "Who's"],
      explanation: "💡 সূক্ষ্ম পার্থক্য: 'Whose' মানে কার (মালিকানা), আর 'Who's' হলো 'Who is'-এর সংক্ষিপ্ত রূপ।"
    }
  ];

  // নিরপেক্ষ শাফলার (Fisher-Yates)
  function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // অ্যাপ স্টেট
  let activeTab = 'vocab';
  let vocabDeck = [];
  let currentVocabItem = null;
  let score = 0;
  let streak = 0;

  // ব্রাউজারের লোকাল স্টোরেজে ভুল শব্দ জমা রাখা
  let mistakeStorage = JSON.parse(localStorage.getItem('userWeakPoints')) || [];

  function recordMistake(item, type) {
    if (!mistakeStorage.some(m => m.id === (item.word || item.q))) {
      mistakeStorage.push({ ...item, id: item.word || item.q, type: type });
      localStorage.setItem('userWeakPoints', JSON.stringify(mistakeStorage));
    }
  }

  function removeMistake(id) {
    mistakeStorage = mistakeStorage.filter(m => m.id !== id);
    localStorage.setItem('userWeakPoints', JSON.stringify(mistakeStorage));
    renderMistakesView();
  }

  function updateAppStats() {
    document.getElementById('scoreStat').innerText = `🎯 পয়েন্ট: ${score}`;
    document.getElementById('streakStat').innerText = `🔥 সঠিক: ${streak}`;
    document.getElementById('remainingStat').innerText = `বাকি: ${vocabDeck.length}`;
    const percent = ((vocabularyData.length - vocabDeck.length) / vocabularyData.length) * 100;
    document.getElementById('progressFill').style.width = `${Math.min(100, Math.max(0, percent))}%`;
  }

  // ভারতীয় উচ্চারণে অডিও প্লে
  function playIndianAudio(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const toSpeak = text || (currentVocabItem ? currentVocabItem.word : "");
    const utterance = new SpeechSynthesisUtterance(toSpeak);
    const voices = window.speechSynthesis.getVoices();
    const indVoice = voices.find(v => v.lang === 'en-IN' || v.name.includes('India') || v.lang.includes('IN'));
    if (indVoice) utterance.voice = indVoice;
    utterance.lang = 'en-IN';
    utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
  }

  function playCurrentAudio() {
    if (currentVocabItem) playIndianAudio(currentVocabItem.word);
  }

  // মোড পরিবর্তন
  function setMode(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-item').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    document.querySelectorAll('.views').forEach(view => view.classList.remove('active'));

    if (tab === 'vocab') {
      document.getElementById('view-vocab').classList.add('active');
      document.getElementById('moduleBadge').innerText = "Oxford Vocabulary";
      nextVocabQuestion();
    } else if (tab === 'grammar') {
      document.getElementById('view-grammar').classList.add('active');
      document.getElementById('moduleBadge').innerText = "Grammar Master";
      nextGrammarQuestion();
    } else if (tab === 'context') {
      document.getElementById('view-context').classList.add('active');
      document.getElementById('moduleBadge').innerText = "Sentence Placement";
      nextClozeQuestion();
    } else if (tab === 'spoken') {
      document.getElementById('view-spoken').classList.add('active');
      document.getElementById('moduleBadge').innerText = "Spoken Mistakes";
      nextSpokenQuestion();
    } else if (tab === 'mistakes') {
      document.getElementById('view-mistakes').classList.add('active');
      document.getElementById('moduleBadge').innerText = "Mistakes Revision";
      renderMistakesView();
    }
  }

  // --- ১. ভোকাবুলারি লজিক ---
  function nextVocabQuestion() {
    document.getElementById('vocabLearning').style.display = 'none';
    document.getElementById('vocabNext').style.display = 'none';

    if (vocabDeck.length === 0) vocabDeck = shuffle(vocabularyData);
    currentVocabItem = vocabDeck.pop();
    updateAppStats();

    document.getElementById('vocabWord').innerText = currentVocabItem.word;
    document.getElementById('vocabPron').innerText = `বাংলা উচ্চারণ: ${currentVocabItem.pron}`;

    let options = [currentVocabItem.meaning];
    let pool = shuffle(vocabularyData.filter(v => v.word !== currentVocabItem.word));
    for (let i = 0; i < pool.length && options.length < 4; i++) {
      options.push(pool[i].meaning);
    }
    options = shuffle(options); // নিরপেক্ষ অবস্থান

    const container = document.getElementById('vocabOptions');
    container.innerHTML = options.map(opt => `
      <button class="option-card" onclick="evalVocab(this, '${opt}')">${opt}</button>
    `).join('');
  }

  function evalVocab(btn, selected) {
    const buttons = document.querySelectorAll('#vocabOptions .option-card');
    buttons.forEach(b => b.disabled = true);

    const isRight = (selected === currentVocabItem.meaning);
    const statusBox = document.getElementById('vocabStatus');

    if (isRight) {
      btn.classList.add('correct');
      statusBox.innerText = "🎉 অসাধারণ! আপনার উত্তর একদম সঠিক।";
      statusBox.style.color = "#059669";
      score += 10;
      streak += 1;
      playIndianAudio(currentVocabItem.word);
    } else {
      btn.classList.add('wrong');
      statusBox.innerText = `❌ ভুল হয়েছে! সঠিক উত্তর: "${currentVocabItem.meaning}"`;
      statusBox.style.color = "#dc2626";
      streak = 0;
      recordMistake(currentVocabItem, 'Vocabulary');
      buttons.forEach(b => {
        if (b.innerText.trim() === currentVocabItem.meaning) b.classList.add('correct');
      });
    }

    document.getElementById('vocabSentEn').innerText = `বাক্য: ${currentVocabItem.en}`;
    document.getElementById('vocabSentBn').innerText = `বাংলা: ${currentVocabItem.bn}`;
    document.getElementById('vocabLearning').style.display = 'block';
    document.getElementById('vocabNext').style.display = 'block';
    updateAppStats();
  }

  // --- ২. গ্রামার লজিক ---
  let grammarDeck = [];
  let currentGrammarItem = null;

  function nextGrammarQuestion() {
    document.getElementById('grammarLearning').style.display = 'none';
    document.getElementById('grammarNext').style.display = 'none';

    if (grammarDeck.length === 0) grammarDeck = shuffle(grammarData);
    currentGrammarItem = grammarDeck.pop();

    document.getElementById('grammarTopicName').innerText = `📌 টপিক: ${currentGrammarItem.topic}`;
    document.getElementById('grammarQuestion').innerText = currentGrammarItem.q;
    document.getElementById('grammarContext').innerText = currentGrammarItem.context;

    const randomizedOpts = shuffle(currentGrammarItem.options);
    const container = document.getElementById('grammarOptions');
    container.innerHTML = randomizedOpts.map(opt => `
      <button class="option-card" onclick="evalGrammar(this, '${opt}')">${opt}</button>
    `).join('');
  }

  function evalGrammar(btn, selected) {
    const buttons = document.querySelectorAll('#grammarOptions .option-card');
    buttons.forEach(b => b.disabled = true);

    const isRight = (selected.toLowerCase() === currentGrammarItem.correct.toLowerCase());

    if (isRight) {
      btn.classList.add('correct');
      score += 10;
    } else {
      btn.classList.add('wrong');
      recordMistake(currentGrammarItem, 'Grammar');
      buttons.forEach(b => {
        if (b.innerText.toLowerCase() === currentGrammarItem.correct.toLowerCase()) b.classList.add('correct');
      });
    }

    document.getElementById('grammarRule').innerText = currentGrammarItem.rule;
    document.getElementById('grammarLearning').style.display = 'block';
    document.getElementById('grammarNext').style.display = 'block';
  }

  // --- ৩. বাক্যে শূন্যস্থান লজিক ---
  let clozeDeck = [];
  let currentClozeItem = null;

  function nextClozeQuestion() {
    document.getElementById('clozeNext').style.display = 'none';
    if (clozeDeck.length === 0) clozeDeck = shuffle(vocabularyData);
    currentClozeItem = clozeDeck.pop();

    const regex = new RegExp(`\\b${currentClozeItem.word}\\b`, 'gi');
    const blankSentence = currentClozeItem.en.replace(regex, '_______');

    document.getElementById('clozeQuestion').innerText = blankSentence;
    document.getElementById('clozeBangla').innerText = `বাংলা: ${currentClozeItem.bn}`;

    let options = [currentClozeItem.word];
    let pool = shuffle(vocabularyData.filter(v => v.word !== currentClozeItem.word));
    for (let i = 0; i < pool.length && options.length < 4; i++) {
      options.push(pool[i].word);
    }
    options = shuffle(options);

    const container = document.getElementById('clozeOptions');
    container.innerHTML = options.map(opt => `
      <button class="option-card" onclick="evalCloze(this, '${opt}')">${opt}</button>
    `).join('');
  }

  function evalCloze(btn, selected) {
    const buttons = document.querySelectorAll('#clozeOptions .option-card');
    buttons.forEach(b => b.disabled = true);

    if (selected.toLowerCase() === currentClozeItem.word.toLowerCase()) {
      btn.classList.add('correct');
      score += 10;
      playIndianAudio(currentClozeItem.en);
    } else {
      btn.classList.add('wrong');
      recordMistake(currentClozeItem, 'Sentence Cloze');
      buttons.forEach(b => {
        if (b.innerText.toLowerCase() === currentClozeItem.word.toLowerCase()) b.classList.add('correct');
      });
    }
    document.getElementById('clozeNext').style.display = 'block';
  }

  // --- ৪. স্পোকেন মিস্টেক্স লজিক ---
  let spokenDeck = [];
  let currentSpokenItem = null;

  function nextSpokenQuestion() {
    document.getElementById('spokenLearning').style.display = 'none';
    document.getElementById('spokenNext').style.display = 'none';

    if (spokenDeck.length === 0) spokenDeck = shuffle(spokenMistakesData);
    currentSpokenItem = spokenDeck.pop();

    document.getElementById('spokenSentence').innerText = currentSpokenItem.q;
    document.getElementById('spokenContext').innerText = currentSpokenItem.context;

    const randomizedOpts = shuffle(currentSpokenItem.options);
    const container = document.getElementById('spokenOptions');
    container.innerHTML = randomizedOpts.map(opt => `
      <button class="option-card" onclick="evalSpoken(this, '${opt}')">${opt}</button>
    `).join('');
  }

  function evalSpoken(btn, selected) {
    const buttons = document.querySelectorAll('#spokenOptions .option-card');
    buttons.forEach(b => b.disabled = true);

    if (selected.toLowerCase() === currentSpokenItem.correct.toLowerCase()) {
      btn.classList.add('correct');
      score += 10;
    } else {
      btn.classList.add('wrong');
      recordMistake(currentSpokenItem, 'Common Mistake');
      buttons.forEach(b => {
        if (b.innerText.toLowerCase() === currentSpokenItem.correct.toLowerCase()) b.classList.add('correct');
      });
    }

    document.getElementById('spokenExplanation').innerText = currentSpokenItem.explanation;
    document.getElementById('spokenLearning').style.display = 'block';
    document.getElementById('spokenNext').style.display = 'block';
  }

  // --- ৫. দুর্বলতা রিভিশন খাতা রেন্ডার ---
  function renderMistakesView() {
    const container = document.getElementById('mistakeContainer');
    if (mistakeStorage.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div style="font-size:35px; margin-bottom:10px;">🌟</div>
          <b>আপনার কোনো ভুল উত্তর জমা নেই!</b><br>
          <span style="font-size:13px;">কুইজ প্র্যাকটিস করার সময় ভুল হলে তা নিজে থেকেই এখানে জমা হবে।</span>
        </div>
      `;
      return;
    }

    container.innerHTML = `
      <div style="font-size:13px; color:#1e40af; background:#eff6ff; padding:10px; border-radius:10px; margin-bottom:12px;">
        📌 মোট ভুল জমেছে: <b>${mistakeStorage.length}</b> টি। রিভিশন দিয়ে শেখা হয়ে গেলে 'শিখে ফেলেছি' বাটনে চাপ দিন।
      </div>
    ` + mistakeStorage.map(item => `
      <div class="study-card" style="text-align:left; margin-bottom:10px; padding:14px;">
        <div style="font-size:11px; color:#dc2626; font-weight:bold; text-transform:uppercase;">${item.type}</div>
        <div style="font-size:18px; font-weight:800; color:#1e1b4b; margin:3px 0;">${item.word || item.q}</div>
        <div style="font-size:14px; color:#059669; font-weight:600;">সঠিক উত্তর: ${item.meaning || item.correct}</div>
        <button onclick="removeMistake('${item.id}')" style="margin-top:8px; background:#059669; color:white; border:none; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:bold; cursor:pointer;">
          ✔️ শিখে ফেলেছি (বাদ দিন)
        </button>
      </div>
    `).join('');
  }

  // অডিও সার্ভিস
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.getVoices();
    };
  }

  // শুরু
  setMode('vocab');
</script>
</body>
</html>
